name: Build and Release TabCompleter

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Collect JARs
        run: |
          SPIGOT_JAR=$(find spigot/target/ -name "*.jar" ! -name "original-*" | head -n 1)
          VELOCITY_JAR=$(find velocity/target/ -name "*.jar" ! -name "original-*" | head -n 1)
          BUNGEECORD_JAR=$(find bungeecord/target/ -name "*.jar" ! -name "original-*" | head -n 1)

          if [ -z "$SPIGOT_JAR" ] || [ -z "$VELOCITY_JAR" ] || [ -z "$BUNGEECORD_JAR" ]; then
            echo "Fehler: Eine oder mehrere JAR-Dateien konnten nicht gefunden werden!"
            exit 1
          fi

          cp "$SPIGOT_JAR"     "./TabCompleter-Spigot-build-${{ github.run_number }}.jar"
          cp "$VELOCITY_JAR"   "./TabCompleter-Velocity-build-${{ github.run_number }}.jar"
          cp "$BUNGEECORD_JAR" "./TabCompleter-BungeeCord-build-${{ github.run_number }}.jar"
          
          cp "$SPIGOT_JAR"     "./TabCompleter-Spigot-latest.jar"
          cp "$VELOCITY_JAR"   "./TabCompleter-Velocity-latest.jar"
          cp "$BUNGEECORD_JAR" "./TabCompleter-BungeeCord-latest.jar"

      - name: Create Archive Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "TabCompleter Build #${{ github.run_number }}"
          body: "Archive of Build #${{ github.run_number }}"
          files: |
            TabCompleter-Spigot-build-${{ github.run_number }}.jar
            TabCompleter-Velocity-build-${{ github.run_number }}.jar
            TabCompleter-BungeeCord-build-${{ github.run_number }}.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete Old Latest Tag
        run: |
          git tag -d latest || true
          git push origin :refs/tags/latest || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "TabCompleter Latest Build"
          body: "This release contains the latest executable and source code from the main branch."
          files: |
            TabCompleter-Spigot-latest.jar
            TabCompleter-Velocity-latest.jar
            TabCompleter-BungeeCord-latest.jar
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
