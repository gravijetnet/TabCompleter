# TabCompleter Configuration (Velocity)
# Color codes: https://htmlcolorcodes.com/minecraft-color-codes/

prefix: ""
bypass-permission: tabcompleter.bypass
reload-permission: tabcompleter.reload
no-permission-message: "&cThis command does not exist."

# Commands blocked from tab-completion and execution for all players.
# Players with bypass-permission (or * permission) are never affected.
blocked-commands:
  - op
  - deop
  - stop
  - reload
