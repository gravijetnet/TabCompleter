# TabCompleter Configuration (Velocity)
# Color codes: https://htmlcolorcodes.com/minecraft-color-codes/

prefix: ""
bypass-permission: tabcompleter.bypass
reload-permission: tabcompleter.reload
no-permission-message: "&cThis command does not exist."

# Custom server brand shown in the F3 debug screen. Leave empty to keep the default.
# Supports color codes with & (e.g. "&cgravijet.net").
server-brand: "&cgravijet.net&f&r"


# Commands blocked for all players (those without the bypass permission).
# Blocking "friend" also blocks "essentials:friend" and all other namespace variants.
# With an empty list, all commands are accessible by default.
blocked-commands: []
