name: TabCompleter
version: 2.0
main: net.gravijet.tabcompleter.spigot.SpigotMain
description: Restricts tab completion and command execution based on permissions.
author: gravijet
api-version: 1.20

commands:
  tabcompleter:
    description: TabCompleter management command
    usage: /tabcompleter [reload]
    permission: tabcompleter.admin

permissions:
  tabcompleter.admin:
    description: Access to the /tabcompleter management command
    default: op
  tabcompleter.bypass:
    description: Bypass all tab-completion and command restrictions
    default: op
  tabcompleter.reload:
    description: Reload the plugin configuration
    default: op
  tabcompleter.group.default:
    description: Access to default group commands (configure in config.yml)
    default: false
  tabcompleter.group.mod:
    description: Access to mod group commands (configure in config.yml)
    default: false
  tabcompleter.group.admin:
    description: Access to admin group commands (configure in config.yml)
    default: false
