# TabCompleter Configuration (Spigot)
# Color codes: https://htmlcolorcodes.com/minecraft-color-codes/

prefix: ""
bypass-permission: tabcompleter.bypass
reload-permission: tabcompleter.reload
no-permission-message: "&cThis command does not exist."

# Custom server brand shown in the F3 debug screen. Leave empty to keep the default.
# Supports color codes with & (e.g. "&cexample.invalid").
server-brand: "&cexample.invalid&f&r"

# allowlist: only the listed commands are visible/usable for players without a group permission.
# blocklist: only the listed commands are hidden/blocked for players without a group permission.
# Default is allowlist — with an empty commands list, ungrouped players see nothing.
mode: allowlist

# Base commands accessible to ALL players (including those in groups).
# In blocklist mode this list acts as the blocklist instead.
# Note: listing "version" allows ONLY "/version", NOT "/bukkit:version".
#       To allow all commands of a plugin namespace, list the namespace (e.g. "essentials").
commands: []

# Groups control which additional commands each role can tab-complete and execute.
# Players need the group's permission to access its commands.
# Commands listed under 'commands' above are always accessible, regardless of group.
# Default permission format: tabcompleter.group.<groupname>
# Use 'inherits' to extend another group without duplicating commands.
#
# Example:
# groups:
#   mod:
#     permission: tabcompleter.group.mod
#     commands:
#       - kick
#       - mute
#   admin:
#     permission: tabcompleter.group.admin
#     inherits:
#       - mod
#     commands:
#       - ban
#       - op
#       - deop
#       - stop
#       - reload
groups: {}
